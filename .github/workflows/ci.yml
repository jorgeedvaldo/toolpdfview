name: Build release (APK + AAB)

# Builds, tests and stores ToolPDF View.
#
# It runs on every push to a development branch, by hand from the Actions tab
# ("Run workflow"), and on a tag like v1.0.1. The signed APK and AAB land in
# the "releases/" folder at the root of the repository - but only after the
# app has passed its tests, including a walk-through on a real Android
# emulator.
on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
    # The commit that stores a build must not start another build.
    paths-ignore:
      - 'releases/**'
      - 'docs/screenshots/**'
      - '**.md'
  pull_request:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Version name, e.g. 1.0.1 (empty = the one in pubspec.yaml)'
        required: false
        default: ''
      build_number:
        description: 'Version code, e.g. 2 (empty = the one in pubspec.yaml)'
        required: false
        default: ''
      commit_artifacts:
        description: 'Commit the APK/AAB into releases/'
        type: boolean
        required: false
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      # The same code, on the real rendering engine with the real PDFium:
      # opening, zooming, selecting and copying text in all five languages.
      - name: Install what the desktop test build needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev ninja-build clang cmake pkg-config xvfb python3-pil

      - name: Integration tests
        run: xvfb-run -a -s "-screen 0 1280x1024x24" flutter test integration_test -d linux

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          pubspec_version="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          name="${{ inputs.build_name }}"
          number="${{ inputs.build_number }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${name:-${GITHUB_REF_NAME#v}}"
          fi
          name="${name:-${pubspec_version%%+*}}"
          number="${number:-${pubspec_version##*+}}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "full=$name+$number" >> "$GITHUB_OUTPUT"
          echo "Building ToolPDF View $name ($number)"

      # Only the two ARM architectures real phones use; x86/x86_64 are
      # emulator-only and would roughly double the download.
      - name: Build APK
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.number }}"

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --target-platform android-arm,android-arm64 \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.number }}"

      - name: Collect the artifacts into releases/
        id: collect
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.name }}-${{ steps.version.outputs.number }}"
          mkdir -p releases
          # Only the current build lives here; older ones stay in the history.
          rm -f releases/*.apk releases/*.aab
          apk="releases/toolpdf-view-${version}.apk"
          aab="releases/toolpdf-view-${version}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          cp build/app/outputs/bundle/release/app-release.aab "$aab"
          {
            echo "# ToolPDF View builds"
            echo
            echo "Signed with the public release key in \`android/keystore/\`."
            echo "The \`.aab\` is the file to upload to the Google Play Console;"
            echo "the \`.apk\` is for installing directly on a phone."
            echo
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
            for f in releases/*.apk releases/*.aab; do
              [ -e "$f" ] || continue
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" \
                "$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } > releases/README.md
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"
          ls -lh releases/

      # The last word belongs to a real Android device: the release build is
      # installed on an emulator set to Portuguese and used like a person
      # would - grant access, browse, open a PDF, long-press, copy.
      - name: Build the same release for the emulator (x86_64)
        run: |
          flutter build apk --release \
            --target-platform android-x64 \
            --dart-define=TOOLPDF_E2E=true \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.number }}"
          cp build/app/outputs/flutter-apk/app-release.apk build/e2e.apk

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: End-to-end test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 tool/e2e_android.py build/e2e.apk

      - name: Upload the artifacts to this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolpdf-view-${{ steps.version.outputs.full || github.sha }}
          path: |
            releases/*
            docs/screenshots/*
          if-no-files-found: warn
          retention-days: 30

      - name: Commit the artifacts into the repository
        if: github.event_name == 'push' || inputs.commit_artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases docs/screenshots
          if git diff --cached --quiet; then
            echo 'Nothing new to commit.'
            exit 0
          fi
          git commit -m "Build ToolPDF View ${{ steps.version.outputs.full }} [skip ci]"
          # A tag has no branch to commit to, so the build lands on the
          # default branch instead.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            branch='${{ github.event.repository.default_branch }}'
          else
            branch="${GITHUB_REF_NAME}"
          fi
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "Push rejected, rebasing on origin/${branch} (attempt ${attempt})"
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
          done
          echo "Could not push the build to ${branch}" >&2
          exit 1

      - name: Publish a GitHub release for the tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.collect.outputs.apk }}
            ${{ steps.collect.outputs.aab }}
          generate_release_notes: true
