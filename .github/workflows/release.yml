name: Build release (APK + AAB)

# Runs on every push to a development branch, by hand from the Actions tab
# ("Run workflow"), or by pushing a tag like v1.0.1. The signed APK and AAB
# land in the "releases/" folder at the root of the repository.
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Version name, e.g. 1.0.1 (empty = the one in pubspec.yaml)'
        required: false
        default: ''
      build_number:
        description: 'Version code, e.g. 2 (empty = the one in pubspec.yaml)'
        required: false
        default: ''
      commit_artifacts:
        description: 'Commit the APK/AAB into releases/'
        type: boolean
        required: false
        default: true
  push:
    branches:
      - 'claude/**'
    tags:
      - 'v*'
    # The commit that stores the build must not start another build.
    paths-ignore:
      - 'releases/**'
      - '**.md'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          pubspec_version="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          name="${{ inputs.build_name }}"
          number="${{ inputs.build_number }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${name:-${GITHUB_REF_NAME#v}}"
          fi
          name="${name:-${pubspec_version%%+*}}"
          number="${number:-${pubspec_version##*+}}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "full=$name+$number" >> "$GITHUB_OUTPUT"
          echo "Building ToolPDF View $name ($number)"

      - name: Build APK
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.number }}"

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --target-platform android-arm,android-arm64 \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.number }}"

      - name: Collect the artifacts into releases/
        id: collect
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.name }}-${{ steps.version.outputs.number }}"
          mkdir -p releases
          apk="releases/toolpdf-view-${version}.apk"
          aab="releases/toolpdf-view-${version}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          cp build/app/outputs/bundle/release/app-release.aab "$aab"
          {
            echo "# ToolPDF View builds"
            echo
            echo "Signed with the public release key in \`android/keystore/\`."
            echo "The \`.aab\` is the file to upload to the Google Play Console;"
            echo "the \`.apk\` is for installing directly on a phone."
            echo
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
            for f in releases/*.apk releases/*.aab; do
              [ -e "$f" ] || continue
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" \
                "$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } > releases/README.md
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"
          ls -lh releases/

      - name: Upload the artifacts to this run
        uses: actions/upload-artifact@v4
        with:
          name: toolpdf-view-${{ steps.version.outputs.full }}
          path: releases/*
          if-no-files-found: error

      - name: Commit the artifacts into the repository
        if: github.event_name == 'push' || inputs.commit_artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases
          if git diff --cached --quiet; then
            echo 'Nothing new to commit.'
            exit 0
          fi
          git commit -m "Build ToolPDF View ${{ steps.version.outputs.full }} [skip ci]"
          # A tag has no branch to commit to, so the build lands on the
          # default branch instead.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            branch='${{ github.event.repository.default_branch }}'
          else
            branch="${GITHUB_REF_NAME}"
          fi
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "Push rejected, rebasing on origin/${branch} (attempt ${attempt})"
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
          done
          echo "Could not push the build to ${branch}" >&2
          exit 1

      - name: Publish a GitHub release for the tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.collect.outputs.apk }}
            ${{ steps.collect.outputs.aab }}
          generate_release_notes: true
