# Release signing credentials for ToolPDF View.
#
# These are intentionally public: ToolPDF View is an open demonstration of how
# to ship an Android app end to end, so anyone can clone the repository and
# produce a byte-for-byte comparable, signed build.
#
# NOTE: because this key is public, anyone can sign an APK that Android will
# treat as an update to this app. If you ever publish on Google Play, enable
# Play App Signing (the default) so Google holds the real app signing key and
# this key is only the *upload* key.
storeFile=keystore/toolpdfview-release.jks
storePassword=toolpdfview
keyAlias=toolpdfview
keyPassword=toolpdfview
